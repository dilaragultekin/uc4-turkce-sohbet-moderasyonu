<svg xmlns="http://www.w3.org/2000/svg" width="680" height="694" viewBox="0 0 680 694" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>UC4 system architecture</title>
<desc>Input, per-model normalization, five models; the selected model goes to decision, masking and the chat line with latency log; all five models fill the side panel table.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="694" rx="16" fill="#1F1E1D"/>

<rect x="200" y="30" width="280" height="56" rx="8" fill="#262624" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="54" text-anchor="middle" font-size="14" font-weight="600" fill="#F1EFE8">1 · Input</text>
<text x="340" y="73" text-anchor="middle" font-size="12" fill="#B4B2A9">Gradio text box (app.py)</text>
<line x1="340" y1="86" x2="340" y2="117" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="170" y="120" width="340" height="72" rx="8" fill="#262624" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="143" text-anchor="middle" font-size="14" font-weight="600" fill="#F1EFE8">2 · Normalization</text>
<text x="340" y="163" text-anchor="middle" font-size="12" fill="#B4B2A9">regex; each model uses its own variant</text>
<text x="340" y="180" text-anchor="middle" font-size="12" fill="#B4B2A9">inside the timed step</text>
<line x1="340" y1="192" x2="340" y2="223" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="30" y="226" width="620" height="128" rx="12" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="340" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#EEEDFE">3 · Five models, each returns P(offensive)</text>

<rect x="50" y="270" width="108" height="64" rx="8" fill="#444441" stroke="#888780" stroke-width="1"/>
<text x="104" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#F1EFE8">Rule</text>
<text x="104" y="316" text-anchor="middle" font-size="12" fill="#D3D1C7">lexicon, Python</text>

<rect x="168" y="270" width="108" height="64" rx="8" fill="#444441" stroke="#888780" stroke-width="1"/>
<text x="222" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#F1EFE8">TF-IDF</text>
<text x="222" y="316" text-anchor="middle" font-size="12" fill="#D3D1C7">LogReg, FP64</text>

<rect x="286" y="270" width="108" height="64" rx="8" fill="#444441" stroke="#888780" stroke-width="1"/>
<text x="340" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#F1EFE8">W2V + CNN</text>
<text x="340" y="316" text-anchor="middle" font-size="12" fill="#D3D1C7">FP32</text>

<rect x="404" y="270" width="108" height="64" rx="8" fill="#444441" stroke="#888780" stroke-width="1"/>
<text x="458" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#F1EFE8">BERTurk</text>
<text x="458" y="316" text-anchor="middle" font-size="12" fill="#D3D1C7">FP32</text>

<rect x="522" y="270" width="108" height="64" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="1.5"/>
<text x="576" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#9FE1CB">BERTurk</text>
<text x="576" y="316" text-anchor="middle" font-size="12" fill="#5DCAA5">INT8, default</text>

<line x1="190" y1="354" x2="190" y2="393" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="500" y1="354" x2="500" y2="393" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="60" y="396" width="260" height="72" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="1"/>
<text x="190" y="419" text-anchor="middle" font-size="14" font-weight="600" fill="#E1F5EE">4 · Decision</text>
<text x="190" y="439" text-anchor="middle" font-size="12" fill="#9FE1CB">selected model only, timed</text>
<text x="190" y="456" text-anchor="middle" font-size="12" fill="#9FE1CB">P ≥ dev threshold → label</text>

<rect x="360" y="396" width="280" height="72" rx="8" fill="#3C3489" stroke="#7F77DD" stroke-width="1"/>
<text x="500" y="426" text-anchor="middle" font-size="14" font-weight="600" fill="#EEEDFE">Side panel table</text>
<text x="500" y="446" text-anchor="middle" font-size="12" fill="#CECBF6">all 5 models, after timing</text>

<line x1="190" y1="468" x2="190" y2="499" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="60" y="502" width="260" height="72" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="1"/>
<text x="190" y="525" text-anchor="middle" font-size="14" font-weight="600" fill="#E1F5EE">5 · Masking</text>
<text x="190" y="545" text-anchor="middle" font-size="12" fill="#9FE1CB">offensive messages only</text>
<text x="190" y="562" text-anchor="middle" font-size="12" fill="#9FE1CB">s**** or whole message hidden</text>

<line x1="190" y1="574" x2="190" y2="605" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="60" y="608" width="260" height="56" rx="8" fill="#085041" stroke="#1D9E75" stroke-width="1"/>
<text x="190" y="632" text-anchor="middle" font-size="14" font-weight="600" fill="#E1F5EE">6 · Chat line + latency log</text>
<text x="190" y="651" text-anchor="middle" font-size="12" fill="#9FE1CB">ms per message vs 50 ms budget</text>
</svg>
